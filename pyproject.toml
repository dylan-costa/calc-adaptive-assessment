[project]
name = "calcdiff"
version = "0.1.0"
description = "Learning the difficulty of calculus derivative problems from expert pairwise judgments"
authors = [{ name = "Dylan Costa", email = "dylancosta46@gmail.com" }]
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "sympy", "matplotlib", "streamlit", "scikit-learn", "torch"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
